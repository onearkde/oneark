name: Deploy OneArk.de

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (~48 GNews requests/day, free plan allows 100)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/
          node scripts/fetch-news.mjs
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
