name: Deploy OneArk.de

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours: 6 requests x 12 runs = 72/day (free plan allows 100)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build site
        run: |
          echo "Files in repo root:"; ls -la
          [ -f index.html ] || { echo "::error title=Missing file::index.html not found in repo root"; exit 1; }
          [ -f scripts/fetch-news.mjs ] || { echo "::error title=Missing file::scripts/fetch-news.mjs not found"; exit 1; }
          mkdir -p _site
          cp index.html _site/
          node scripts/fetch-news.mjs
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
